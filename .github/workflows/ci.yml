name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# THE SHOPWARE AXIS, and why the jobs below install rather than resolve freely.
#
# `composer.json` declares `shopware/core: ~6.6.0 || ~6.7.0` - two majors. Before
# this axis existed the matrix varied only PHP and let Composer pick the Shopware
# version, which meant BOTH legs resolved v6.6.10.22 and the declared 6.7 support
# was exercised by no job at all (markup-carve/shopware-carve#20). The direction of
# that silence is the bad one: support looked tested, because the suite was green.
#
# So each declared line gets its own leg, installed by name. `--with` narrows the
# root constraint for one run without editing composer.json, and every leg then
# READS THE INSTALLED VERSION BACK and refuses when it is not on the line the leg
# claims. That read-back is the load-bearing part. Without it a leg labelled 6.7
# that silently resolved 6.6 passes - which is this defect again, one layer up,
# and harder to see because now there is a job name asserting otherwise.
#
# 6.7 IS MEASURED, BUT NOT FROM THIS FILE. The 6.7 half of the axis lives in
# `shopware-67.yml`, on the same `pull_request` trigger, running the same install
# and the same read-back. It is expected to be red: no 6.7 currently installs,
# because Composer's default `block-insecure` refuses the whole line over upstream
# security advisories. That red is a true statement about this plugin's declared
# support and is meant to stay visible - see that file's header before touching it.
#
# The split is about ONE reader. `README.md` line 4 carries a public `ci.yml` badge
# on a Packagist-published package that merchants evaluate, and that badge should
# track the line a merchant can actually install. Nothing about the split reduces
# what is measured per commit; it changes only which result the badge summarizes.
# If you edit the install or the read-back here, edit the copy there too - they are
# byte-identical on purpose, and a drift between them is invisible until a leg
# stops discriminating.
#
# Note this is `composer update`, not `composer install`, and there is no
# `composer.lock` in the repo - that question is markup-carve/shopware-carve#18 and
# is deliberately parked. If a lockfile ever lands, these legs still have to
# resolve per-line rather than install it, or the axis stops meaning anything.
jobs:
  test:
    name: Test (PHP ${{ matrix.php-version }}, Shopware ${{ matrix.shopware }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.5']
        shopware: ['~6.6.0']
    steps:
      - name: Checkout shopware-carve
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Install Shopware ${{ matrix.shopware }}
        run: |
          set -euo pipefail
          if ! composer update --no-interaction --no-progress --prefer-dist \
                 --with "shopware/core:${{ matrix.shopware }}"; then
            echo "::error::shopware/core ${{ matrix.shopware }} could not be installed, so the support composer.json declares for that line is unverified. Composer's reasoning is above; when it names a security advisory the fix is upstream and this leg stays red until it lands."
            exit 1
          fi

      - name: Verify the Shopware line this leg measures
        run: |
          set -euo pipefail
          constraint='${{ matrix.shopware }}'
          # '~6.7.0' -> '6.7'. The leg asserts the LINE, not an exact patch: which
          # patch release Composer picks is upstream's business, which major it
          # picked is this job's whole point.
          line="${constraint#\~}"
          line="${line%.*}"
          installed="$(composer show --format=json shopware/core 2>/dev/null | php -r '$d = json_decode(stream_get_contents(STDIN), true); echo $d["versions"][0] ?? "";')"
          if [ -z "${installed}" ]; then
            echo "::error::shopware/core is not installed, so this leg exercised no Shopware at all"
            exit 1
          fi
          echo "constraint ${constraint} -> installed ${installed}"
          case "${installed#v}" in
            "${line}."*) ;;
            *)
              echo "::error::this leg is named for Shopware ${line} but installed ${installed}, so it measures a line the job does not claim"
              exit 1
              ;;
          esac

      - name: Test
        run: composer test

  # PHPStan gets the SAME axis, and it is the more sensitive half of it: `src/`
  # references 15 distinct `Shopware\Core\*` classes while `tests/` reaches 3, so
  # a signature or namespace change between the lines shows up here well before it
  # shows up in an assertion. Its 6.7 twin is in `shopware-67.yml`; between them the
  # detector runs on both declared lines rather than permanently on one.
  #
  # PHP stays fixed at 8.3 - the PHP axis is the test job's job, and crossing both
  # here would buy repetition rather than coverage.
  static-analysis:
    name: PHPStan (Shopware ${{ matrix.shopware }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shopware: ['~6.6.0']
    steps:
      - name: Checkout shopware-carve
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install Shopware ${{ matrix.shopware }}
        run: |
          set -euo pipefail
          if ! composer update --no-interaction --no-progress --prefer-dist \
                 --with "shopware/core:${{ matrix.shopware }}"; then
            echo "::error::shopware/core ${{ matrix.shopware }} could not be installed, so nothing here analyses this plugin against that line."
            exit 1
          fi

      # Same read-back as the test job, and for the same reason: analysing 6.6
      # under a job named for 6.7 is worse than not running at all.
      - name: Verify the Shopware line this leg measures
        run: |
          set -euo pipefail
          constraint='${{ matrix.shopware }}'
          line="${constraint#\~}"
          line="${line%.*}"
          installed="$(composer show --format=json shopware/core 2>/dev/null | php -r '$d = json_decode(stream_get_contents(STDIN), true); echo $d["versions"][0] ?? "";')"
          if [ -z "${installed}" ]; then
            echo "::error::shopware/core is not installed, so this leg analysed against no Shopware at all"
            exit 1
          fi
          echo "constraint ${constraint} -> installed ${installed}"
          case "${installed#v}" in
            "${line}."*) ;;
            *)
              echo "::error::this leg is named for Shopware ${line} but installed ${installed}, so it measures a line the job does not claim"
              exit 1
              ;;
          esac

      - name: PHPStan
        run: composer stan

  # phpcs is token-based: it reads this repository's own source against this
  # repository's own ruleset and never loads a Shopware class, so its result cannot
  # differ between the two lines. It used to ride along in the analysis job, where
  # the axis above would now run it once per Shopware line for a byte-identical
  # result, and report it only on the lines that installed - which today would mean
  # not reporting it from the 6.7 workflow at all.
  #
  # It still resolves freely rather than by line, and that is a weaker guarantee
  # than the legs above have, not an equal one: `shopware/core` is a root
  # requirement, so this job reports the coding standard as long as SOME declared
  # line installs, and stops reporting it if none does. Buying full independence
  # would mean a second manifest carrying the dev tools, which is more moving parts
  # than a style check is worth.
  coding-standards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout shopware-carve
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Code sniffer
        run: composer cs-check

  # The JS lane. Before this job existed nothing in CI installed npm at all:
  # the two jobs above are `composer install`, `engine-drift.yml` is
  # `composer update`, and `release.yml` installs no dependencies. So
  # `@markup-carve/carve` was declared in the admin module and exercised by
  # nothing, and a change that broke the admin bundle went green
  # (markup-carve/shopware-carve#19).
  #
  # Worse than unmeasured: `shopware-cli extension zip` runs `npm install`, so
  # before this job the FIRST run that resolved this dependency was the one
  # producing the release artifact (RELEASING.md). A lockfile plus this job move
  # that resolve to a pull request, where a failure is cheap.
  admin-js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Resources/app/administration
    steps:
      - name: Checkout shopware-carve
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # The engine declares `engines.node >= 20`; 22 is the current LTS.
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Resources/app/administration/package-lock.json

      # `ci`, not `install`: it installs the lockfile exactly and fails when the
      # lockfile and package.json disagree, so this run measures a stated engine
      # rather than whatever the registry serves at the moment it runs.
      - name: Install from the lockfile
        run: npm ci --no-audit --no-fund

      # A lockfile nothing reads back is not a pin. This step reports the engine
      # behind the result, and refuses when the lock names none or when what is
      # installed is not what the lock names - a dropped lockfile, a hand-edited
      # tree, or an `npm install` that quietly re-resolved.
      - name: Verify the engine this run measures
        run: |
          set -euo pipefail
          pkg='@markup-carve/carve'
          locked="$(node -e '
            const lock = require("./package-lock.json");
            const entry = (lock.packages || {})["node_modules/@markup-carve/carve"];
            process.stdout.write(entry && entry.version ? entry.version : "");
          ')"
          if [ -z "${locked}" ]; then
            echo "::error::package-lock.json pins no ${pkg}, so this run measured an unstated engine"
            exit 1
          fi
          # By path, deliberately. The engine's `exports` map does not expose
          # ./package.json, so `require('@markup-carve/carve/package.json')`
          # throws ERR_PACKAGE_PATH_NOT_EXPORTED and would read as the package
          # being absent.
          installed="$(node -e '
            const fs = require("fs");
            const p = "./node_modules/@markup-carve/carve/package.json";
            process.stdout.write(fs.existsSync(p) ? (JSON.parse(fs.readFileSync(p, "utf8")).version || "") : "");
          ')"
          if [ -z "${installed}" ]; then
            echo "::error::${pkg} is not installed, so nothing here exercises the admin engine"
            exit 1
          fi
          echo "${pkg} locked=${locked} installed=${installed}"
          if [ "${installed}" != "${locked}" ]; then
            echo "::error::installed ${pkg} ${installed} is not the locked ${locked}"
            exit 1
          fi

      # Installing the engine proves it downloads. Building the entry proves the
      # admin module graph still resolves against it and that the named export
      # the components import is really there: esbuild fails on an unresolved
      # import AND on `No matching export`, so an engine that renamed
      # `carveToHtml` fails here rather than in a merchant's admin panel.
      #
      # esbuild is pinned and run through npx rather than added to the admin
      # package.json: `shopware-cli extension zip` runs `npm install` in that
      # directory at release time, so a devDependency there would ship a build
      # tool inside the plugin ZIP.
      - name: Build the admin bundle
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          npx --yes esbuild@0.28.2 --bundle src/main.js \
            --loader:.twig=text --format=esm \
            --outfile="${out}/admin.js" --metafile="${out}/meta.json"
          # Structural, not a size heuristic: the engine's files must actually be
          # inputs of the bundle. Without this, aliasing or externalizing the
          # engine would still produce a bundle and still pass, which is the same
          # measures-nothing shape this job exists to remove.
          node -e '
            const meta = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const engine = Object.keys(meta.inputs)
              .filter((p) => p.includes("node_modules/@markup-carve/carve/"));
            if (engine.length === 0) {
              console.error("::error::the admin bundle pulled in no @markup-carve/carve file, so the build did not exercise the engine");
              process.exit(1);
            }
            console.log("engine files in the bundle: " + engine.join(", "));
          ' "${out}/meta.json"

      # The artifact, not the version string. A version that matches the lock
      # says nothing about what the engine does; this renders one document
      # through the export the admin components actually call.
      - name: Render one document through the installed engine
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { carveToHtml } from "@markup-carve/carve";
            const html = carveToHtml("*bold* and /italic/");
            console.log(html);
            if (!html.includes("<strong>bold</strong>") || !html.includes("<em>italic</em>")) {
              console.error("::error::the installed engine did not render Carve emphasis as expected: " + html);
              process.exit(1);
            }
          '
